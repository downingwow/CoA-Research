name: Research unresolved CoA spell IDs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-unresolved-spells.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build unresolved spell evidence queue
        run: python tools/build_unresolved_spell_triage.py
      - name: Publish research audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/COA-UNRESOLVED-SPELL-TRIAGE.csv datasets/relationships/unresolved-spell-triage.json
          if ! git diff --cached --quiet; then
            git commit -m "research: publish unresolved CoA spell triage and evidence ranking"
            git push
          fi
