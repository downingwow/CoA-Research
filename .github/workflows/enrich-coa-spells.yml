name: Enrich CoA spell definitions (manual)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enrich-coa-spells.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enrich and validate archived CoA spell records
        run: python tools/enrich_spell_relationships.py
      - name: Commit verified enrichment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/relationships/enriched-spells-by-id.json.gz datasets/relationships/enrichment-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish CoA archived spell definitions and enrichment audit"
            git push
          fi
