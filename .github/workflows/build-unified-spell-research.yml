name: Build unified CoA spell research index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-unified-spell-research.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge spell evidence with provenance
        run: python tools/build_unified_spell_research.py
      - name: Commit unified index and conflict audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/relationships/unified-spell-*
          if ! git diff --cached --quiet; then
            git commit -m "research: publish 9656-spell unified evidence index and source conflicts"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
