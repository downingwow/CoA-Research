name: Import Exiles CoA talent trees
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-exiles-talents.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch 155 preserved talent trees
        run: |
          curl -fLsS --retry 3 https://raw.githubusercontent.com/hertigservices/ascension-data/main/supplemental/exiles-db/6bcecd0faa6c2e7084d8015e1d931431c30e3013a9122810d593868196a3578b/talents.jsonl.gz -o /tmp/exiles-talents.jsonl.gz
      - name: Normalize trees and candidate spec associations
        run: python tools/import_exiles_talent_trees.py /tmp/exiles-talents.jsonl.gz
      - name: Commit historical talent research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/relationships/exiles-talent-tree-*
          if ! git diff --cached --quiet; then
            git commit -m "research: preserve 155 historical CoA talent trees"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
