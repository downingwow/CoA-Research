name: Collect CoA source records
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-coa-data.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      max_files:
        description: Maximum upstream source files to collect in this run
        required: false
        default: '400'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: coa-bulk-collection
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and index source records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_FILES: ${{ inputs.max_files || '160' }}
        run: python tools/collect_coa_data.py --max-files "$MAX_FILES"
      - name: Commit imported records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/bulk
          if ! git diff --cached --quiet; then
            git commit -m "data: bulk import CoA records and ID indexes"
            git push
          fi
